[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# Legacy demo URLs → their home under the service route. Every other URL is a
# real file in out/ (Next static export), so there is no SPA catch-all, and
# unknown URLs get out/404.html automatically.
[[redirects]]
  from = "/demos/win-back-campaign"
  to = "/services/automated-workflows/win-back-campaigns/demo"
  status = 301

[[redirects]]
  from = "/demos/missed-call-text-back"
  to = "/services/automated-workflows/missed-call-text-back/demo"
  status = 301

